<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        CALCULATEDX PRO
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- Barre de navigation -->
    <header class="navbar">

        <div class="container navbar-content">

            <a href="{{ url_for('accueil') }}" class="brand">
                <span class="brand-icon">CX</span>

                <span class="brand-name">
                    CALCULATEDX
                    <small>PRO</small>
                </span>
            </a>

            <nav class="nav-links">

                <a href="{{ url_for('accueil') }}">
                    Accueil
                </a>

                <a href="{{ url_for('calcul') }}">
                    Calculatrice
                </a>

                <a href="{{ url_for('historique') }}">
                    Historique
                </a>

            </nav>

        </div>

    </header>


    <!-- Contenu propre à chaque page -->
    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Pied de page -->
    <footer class="footer">

        <div class="container footer-content">

            <p>
                CALCULATEDX PRO
            </p>

            <p class="footer-tech">
                Python • Flask • REST API
            </p>

        </div>

    </footer>

</body>
</html>
